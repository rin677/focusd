name: focusd
root: ~/Code/focusd/

windows:
  - editor: nvim :SessionLoad focusd

  - build/run:
      layout: main-vertical
      panes:
        - Build: fd -e rs | entr -r cargo build --no-default-features --features dev-build
        - Run:
  - SQL: sqlite3 ~/.local/share/focusd/db/history-dev.db
  - misc:
