name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: get-tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            RELEASED=$(gh release list --json tagName --jq '.[].tagName')
            TAG=$(git tag --sort=-v:refname | while read t; do
              if ! echo "$RELEASED" | grep -q "^${t}$"; then
                echo "$t"
                break
              fi
            done)
          fi

          if [[ -z "$TAG" ]]; then
            echo "No unreleased tag found"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing: $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: focusd
            artifact_name: focusd-linux-x86_64

          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: focusd
            artifact_name: focusd-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp \
            target/${{ matrix.target }}/release/${{ matrix.binary_name }} \
            dist/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten Artifacts
        run: |
          mkdir release
          find dist -type f -exec cp {} release/ \;

      - name: Detect prerelease
        id: prerelease
        run: |
          TAG="${{ needs.resolve-tag.outputs.tag }}"

          if [[ "$TAG" =~ [ab] ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          body_path: release-notes.md
          files: release/*
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear release notes
        if: steps.prerelease.outputs.prerelease != 'true'
        run: |
          : > release-notes.md

      - name: Commit cleared release notes
        if: steps.prerelease.outputs.prerelease != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add release-notes.md

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: clear release notes"
          git push origin master
