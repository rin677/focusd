name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: focusd
            asset_name: focusd-linux-x86_64

          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: focusd
            asset_name: focusd-macos-x86_64

          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: focusd
            asset_name: focusd-macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: focusd.exe
            asset_name: focusd-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp \
            target/${{ matrix.target }}/release/${{ matrix.binary_name }} \
            dist/${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
