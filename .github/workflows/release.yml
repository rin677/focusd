name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: myapp
            asset_name: myapp-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: myapp
            asset_name: myapp-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: myapp
            asset_name: myapp-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: myapp.exe
            asset_name: myapp-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
