[package]
name = "focusd"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
rusqlite = { version = "0.40.1", default-features = false }
chrono = { version = "0.4.45" }
notify-rust = "4.18.0"
figlet-rs = "1.0.0"
serde_json = "1.0"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled", "rusqlite/chrono"]
dev-build = ["rusqlite/chrono"]
